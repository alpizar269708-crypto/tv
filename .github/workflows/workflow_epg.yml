name: 2. Actualizar EPG
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

# Ambos workflows modifican main; deben compartir el mismo grupo para evitar
# que sus commits simultáneos se rechacen entre sí.
concurrency:
  group: tv-main-updates-v2
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Actualizar EPG
      run: python update_epg.py

    - name: Subir cambios
      run: |
        set -e
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add epg.xml
        if git diff --cached --quiet; then
          echo "EPG sin cambios; no hay nada que subir."
          exit 0
        fi
        git commit -m "Update EPG"
        # Reintegrar commits que hayan llegado desde el checkout y reintentar
        # si otro proceso externo actualiza main durante el push.
        for attempt in 1 2 3; do
          git fetch origin main
          git rebase origin/main
          if git push origin HEAD:main; then
            exit 0
          fi
          echo "Push rechazado (intento $attempt); se volverá a sincronizar."
          sleep $((attempt * 2))
        done
        echo "::error::No se pudo subir el EPG después de 3 intentos."
        exit 1

    - name: Cancelar ejecuciones obsoletas y conservar las últimas 5
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set +e
        CUTOFF=$(date -u -d '10 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
        gh run list --limit 100 --json databaseId,status,createdAt |
          jq -r --arg current "$GITHUB_RUN_ID" --arg cutoff "$CUTOFF" '.[] | select((.databaseId | tostring) != $current) | select(.status == "queued" or .status == "in_progress") | select(.createdAt < $cutoff) | .databaseId' |
          while read -r id; do
            [ -z "$id" ] || gh run cancel "$id" || true
          done
        sleep 5
        gh run list --limit 100 --json databaseId,status |
          jq -r '.[5:][] | select(.status == "completed") | .databaseId' |
          while read -r id; do
            [ -z "$id" ] || gh run delete "$id" || true
          done
