name: 1. Actualizar M3U
on:
  # Ejecutar al cambiar código o configuración, pero no cuando el propio job
  # actualiza lista.m3u para evitar ciclos de ejecuciones.
  push:
    branches: [main]
    paths-ignore:
      - 'lista.m3u'
  # Revisar varias veces al día para detectar caídas de los canales prioritarios.
  schedule:
    - cron: '15 */3 * * *'
    # Revisión diaria adicional 30 minutos antes del workflow 2 (EPG, 00:00 UTC).
    - cron: '30 23 * * *'
  workflow_dispatch:

# Ambos workflows modifican main; deben compartir el mismo grupo para evitar
# que sus commits simultáneos se rechacen entre sí.
concurrency:
  group: tv-main-updates
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Instalar ffprobe para verificar video real
      run: |
        if ! command -v ffprobe >/dev/null 2>&1; then
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
        fi
        ffprobe -version | head -n 1
    - name: Probar actualizador M3U
      run: python -m unittest discover -s tests -v
    - name: Actualizar lista M3U y validar canales prioritarios
      run: python update_m3u.py

    - name: Subir cambios
      run: |
        set -e
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        # Guardar la lista recién generada fuera del árbol Git. Si main cambió
        # durante la validación, reconstruimos el commit sobre el HEAD remoto
        # más reciente en vez de rebasar un archivo M3U que puede colisionar.
        cp lista.m3u "$RUNNER_TEMP/lista.m3u.generated"
        for attempt in 1 2 3; do
          git fetch origin main
          git reset --hard origin/main
          cp "$RUNNER_TEMP/lista.m3u.generated" lista.m3u
          git add lista.m3u
          if git diff --cached --quiet; then
            echo "M3U sin cambios; no hay nada que subir."
            exit 0
          fi
          git commit -m "Update M3U"
          if git push origin HEAD:main; then
            exit 0
          fi
          echo "Push rechazado (intento $attempt); se volverá a sincronizar."
          sleep $((attempt * 2))
        done
        echo "::error::No se pudo subir la lista M3U después de 3 intentos."
        exit 1

    - name: Limpiar ejecuciones antiguas (conservar las últimas 5 del repositorio)
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh run list --limit 100 --json databaseId,status -q '.[5:][] | select(.status == "completed") | .databaseId' | while read -r id; do
          [ -z "$id" ] || gh run delete "$id" || true
        done
